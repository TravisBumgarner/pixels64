name: web image

# Publishes the control UI container to GHCR.
#
# Tags are prefixed `web-` so image releases don't collide with firmware or
# hardware versioning elsewhere in this repo. Push `web-v1.0.0` to cut a release;
# pushes to main refresh `edge` so there's always something current to pull.
on:
  push:
    branches: [main]
    tags: ["web-v*"]
    paths:
      - "web/**"
      - ".github/workflows/web-image.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pixels64-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The Pi is arm64 and these runners are amd64. Emulation is fine here —
      # nothing is compiled, it's a file copy into an nginx layer.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Skipped on pull_request: forks have no write access, and a PR should
      # verify the image builds without publishing it.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=web-v(.*),group=1
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/web-v') }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
